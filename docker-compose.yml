version: '3.8'

services:
  webhook-converter:
    image: node:24-alpine
    container_name: webhook-converter
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./app:/usr/src/app
      - ./logs:/usr/src/app/logs
    working_dir: /usr/src/app
    command: sh -c "npm install && node server.js"
